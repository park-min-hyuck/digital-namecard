<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>박민혁 - 디지털 명함</title>
<style>
  :root {
    --bg-1: #ffffff;
    --bg-2: #d9e6fb;
    --card-bg: #ffffff;
    --text-main: #1a1d29;
    --text-sub: #5c6270;
    --accent: #3d6bfd;
    --accent-soft: #eef2ff;
    --border: #e6e9f0;
    --shadow: 0 25px 60px -20px rgba(31, 45, 90, 0.2);
    --toggle-icon: "🌙";
  }

  [data-theme="dark"] {
    --bg-1: #0e1730;
    --bg-2: #000000;
    --card-bg: #151a2b;
    --text-main: #f2f4f8;
    --text-sub: #9aa1b4;
    --accent: #7b9bff;
    --accent-soft: #1f2740;
    --border: #262e45;
    --shadow: 0 25px 60px -20px rgba(0, 0, 0, 0.65);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: "Pretendard", "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 100%);
    transition: background 0.4s ease;
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 380px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 28px;
    padding: 40px 32px 32px;
    box-shadow: var(--shadow);
    text-align: center;
    transition: background 0.4s ease, box-shadow 0.4s ease, border-color 0.4s ease;
  }

  .theme-toggle {
    position: absolute;
    top: 18px;
    right: 18px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--accent-soft);
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s ease, background 0.3s ease;
  }
  .theme-toggle:hover { transform: scale(1.08); }
  .theme-toggle:active { transform: scale(0.95); }

  .avatar {
    width: 108px;
    height: 108px;
    margin: 0 auto 18px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #8fa8ff);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 20px -6px rgba(61, 107, 253, 0.5);
  }
  .avatar svg { width: 54px; height: 54px; fill: #ffffff; opacity: 0.95; }

  .name {
    margin: 0;
    font-size: 24px;
    font-weight: 700;
    color: var(--text-main);
  }

  .role {
    margin: 6px 0 0;
    font-size: 14.5px;
    font-weight: 600;
    color: var(--accent);
  }

  .company {
    margin: 2px 0 14px;
    font-size: 13.5px;
    color: var(--text-sub);
  }

  .bio {
    margin: 0 0 22px;
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--text-sub);
    padding: 0 4px;
  }

  .contact {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 22px;
    text-align: left;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 16px 4px;
  }

  .contact-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13.5px;
    color: var(--text-main);
    text-decoration: none;
  }
  .contact-item svg {
    width: 17px;
    height: 17px;
    flex-shrink: 0;
    fill: var(--accent);
  }
  .contact-item span { word-break: break-all; }

  .sns-row {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .sns-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border-radius: 14px;
    background: var(--accent-soft);
    border: 1px solid var(--border);
    color: var(--text-main);
    text-decoration: none;
    transition: transform 0.25s cubic-bezier(.34,1.56,.64,1), background 0.25s ease, box-shadow 0.25s ease;
  }
  .sns-btn svg { width: 20px; height: 20px; fill: var(--accent); transition: fill 0.25s ease; }

  .sns-btn:hover {
    transform: translateY(-4px) scale(1.12);
    background: var(--accent);
    box-shadow: 0 12px 22px -8px rgba(61, 107, 253, 0.55);
  }
  .sns-btn:active { transform: translateY(-1px) scale(1.04); }
  .sns-btn:hover svg { fill: #ffffff; }

  @media (max-width: 400px) {
    .card { padding: 32px 22px 26px; border-radius: 22px; }
    .name { font-size: 21px; }
  }
</style>
</head>

<script>
  (function () {
    const root = document.documentElement;
    const toggleBtn = document.getElementById('themeToggle');
    const stored = localStorage.getItem('namecard-theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const initial = stored || (prefersDark ? 'dark' : 'light');

    applyTheme(initial);

    toggleBtn.addEventListener('click', function () {
      const current = root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      const next = current === 'dark' ? 'light' : 'dark';
      applyTheme(next);
      localStorage.setItem('namecard-theme', next);
    });

    function applyTheme(theme) {
      root.setAttribute('data-theme', theme);
      toggleBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
    }
  })();
</script>
